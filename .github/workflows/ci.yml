name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Emulator unit tests
        run: make -C cpu-emulator test

      - name: Core stays portable (no I/O)
        run: make -C cpu-emulator check-core

      - name: Emulator end-to-end tests (pseudo-terminal)
        run: make -C cpu-emulator test-interactive

      - name: Community test ROMs
        run: make -C cpu-emulator conformance

      - name: Assembler and Nibble compiler tests (compiled programs run in the emulator)
        run: python3 -m unittest discover -s compiler/tests
        env:
          REQUIRE_EMULATOR: "1"

      - name: Firmware demo builds and runs on the desktop
        run: make -C firmware run

      - name: Firmware tests (menu, font, timing, OLED packing, keypad, ROM table)
        run: make -C firmware test

      - name: Firmware menu builds on the desktop
        run: make -C firmware menu

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell tests (parser, then the real shell, including job control on a pseudo-terminal)
        run: make -C shell test

      - name: Shell tests again with the address and undefined-behavior sanitizers
        run: make -C shell sanitize

  gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference libraries used for cross-checking
        run: pip install numpy tifffile imagecodecs pyshp pyproj

      - name: GIS tests (including cross-checks against tifffile, pyshp and PROJ)
        run: python3 -m unittest discover -s gis/tests
        env:
          REQUIRE_REFERENCE: "1"

  net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scapy (reference for the cross-checks)
        run: pip install scapy

      - name: Packet analyzer tests (including cross-checks against scapy)
        run: make -C net test
        env:
          REQUIRE_REFERENCE: "1"

      - name: Live capture test (needs root for AF_PACKET)
        run: sudo -E env "PATH=$PATH" make -C net test
        env:
          REQUIRE_REFERENCE: "1"
          REQUIRE_LIVE: "1"

      - name: Sanitizer run
        run: make -C net sanitize

  pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Get the Pico SDK
        run: git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"

      - name: Build the Pico firmware
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S firmware/pico -B build-pico -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pico --target chip8_pico -j2
          arm-none-eabi-size build-pico/chip8_pico.elf

      - name: Build it with a single program (no menu)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S firmware/pico -B build-pico-one -DROMS=$PWD/compiler/examples/fib.nib
          cmake --build build-pico-one --target chip8_pico -j2
